{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h3 class="mb-4 text-center">Select Quiz</h3>
    <form method="post" class="w-50 mx-auto">
        {% csrf_token %}
        <div class="mb-3">
            <label for="exam" class="form-label">Select Your Quiz:</label>
            <select name="exam_id" id="exam" class="form-select">
                {% for exam in exams %}
                    <option value="{{ exam.id }}">{{ exam.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-success">start quiz</button>
        </div>
    </form>
</div>
{% endblock %}
